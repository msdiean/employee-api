name: Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Stage 1 - Install Dependencies & Build
    runs-on: [self-hosted, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Build Application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

  unit-test:
    name: Stage 2 - Unit Tests
    needs: build
    runs-on: [self-hosted, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

  gitleaks:
    name: Stage 3 - Secret Scan (Gitleaks)
    needs: unit-test
    runs-on: [self-hosted, web]
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Stage 4 - SonarQube Analysis
    needs: gitleaks
    runs-on: [self-hosted, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run Unit Tests with Coverage
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage

      - name: Install Sonar Scanner CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sonar-scanner

      - name: Verify Sonar Scanner Availability
        shell: bash
        run: |
          set -euo pipefail
          npx sonar-scanner --version

      - name: Run SonarQube Scan
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          PROJECT_KEY="${GITHUB_REPOSITORY//\//_}"

          npx sonar-scanner \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.projectName="$GITHUB_REPOSITORY" \
            -Dsonar.projectVersion="$GITHUB_SHA" \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.test.inclusions=tests/**/*.test.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      - name: Upload Sonar Scan Metadata
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scan-metadata
          path: .scannerwork/report-task.txt
          if-no-files-found: error

  sonarqube-quality-gate:
    name: Stage 5 - SonarQube Quality Gate
    needs: sonarqube
    runs-on: [self-hosted, web]
    permissions:
      contents: read

    steps:
      - name: Download Sonar Scan Metadata
        uses: actions/download-artifact@v4
        with:
          name: sonar-scan-metadata
          path: .scannerwork

      - name: Evaluate SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Display & Enforce Quality Gate Status
        shell: bash
        run: |
          set -euo pipefail
          STATUS="${{ steps.quality-gate.outputs.quality-gate-status }}"
          echo "SonarQube Quality Gate Status: $STATUS"
          if [ "$STATUS" != "PASSED" ]; then
            echo "::error::SonarQube Quality Gate FAILED. Failing pipeline."
            exit 1
          fi
          echo "SonarQube Quality Gate PASSED."

  npm-audit:
    name: Stage 6 - Dependency Vulnerability Scan (npm audit)
    needs: sonarqube-quality-gate
    runs-on: [self-hosted, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      - name: Run npm audit (prod deps, high+)
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

  package:
    name: Stage 7 - Package Production Artifact
    needs: npm-audit
    runs-on: [self-hosted, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Production Dependencies Only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev

      - name: Create Production Zip Artifact
        shell: bash
        run: |
          set -euo pipefail
          zip -r employee-api.zip src node_modules package.json index.js

      - name: Upload Lambda Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-api-package
          path: employee-api.zip
          retention-days: 7

  deploy:
    name: Stage 8 - Deploy to AWS Lambda
    needs: package
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Lambda Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: employee-api-package
          path: .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::755395261332:role/github-actions-role
          aws-region: ap-south-1
          role-session-name: GitHubActionsLambdaDeploy

      - name: Update AWS Lambda Function Code & Promote Live Alias
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying production package to AWS Lambda..."
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name employee-api-dev \
            --zip-file fileb://employee-api.zip \
            --publish \
            --query 'Version' \
            --output text)
          echo "Published Version: $NEW_VERSION"
          echo "Promoting 'live' alias to Version $NEW_VERSION..."
          aws lambda update-alias \
            --function-name employee-api-dev \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Lambda deployment and live alias promotion successful!"

      - name: Archive Application Package Artifact to S3
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="employee-api-central-audit-dev-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Archiving application zip to s3://${BUCKET_NAME}/build-artifacts/employee-api-${{ github.sha }}.zip..."
            aws s3 cp employee-api.zip "s3://${BUCKET_NAME}/build-artifacts/employee-api-${{ github.sha }}.zip"
          fi

      - name: Deploy Frontend to S3 Static Website
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          FRONTEND_BUCKET="employee-api-frontend-dev-${ACCOUNT_ID}"
          AUDIT_BUCKET="employee-api-central-audit-dev-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$FRONTEND_BUCKET" 2>/dev/null; then
            echo "Syncing public/ Web UI to Frontend S3 bucket s3://${FRONTEND_BUCKET}..."
            aws s3 sync public/ "s3://${FRONTEND_BUCKET}/" --delete
            echo "Frontend successfully deployed to S3 Static Website bucket!"
          elif aws s3api head-bucket --bucket "$AUDIT_BUCKET" 2>/dev/null; then
            echo "Frontend bucket s3://${FRONTEND_BUCKET} not found. Syncing to central audit subfolder s3://${AUDIT_BUCKET}/frontend/..."
            aws s3 sync public/ "s3://${AUDIT_BUCKET}/frontend/" --delete
          else
            echo "WARNING: Neither frontend nor audit S3 bucket was accessible."
          fi

      - name: Archive CI Security Audit Metadata to S3
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          AUDIT_BUCKET="employee-api-central-audit-dev-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$AUDIT_BUCKET" 2>/dev/null; then
            echo "Uploading CI Security Audit report to s3://${AUDIT_BUCKET}/ci-security-scans/..."
            cat <<EOF > ci-security-audit.json
          {
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "scans_completed": ["gitleaks", "sonarqube-quality-gate", "npm-audit"],
            "status": "PASSED"
          }
          EOF
            aws s3 cp ci-security-audit.json "s3://${AUDIT_BUCKET}/ci-security-scans/scan-report-${{ github.sha }}.json"
            echo "CI Security Audit metadata archived successfully!"
          fi
