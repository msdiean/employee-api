name: Application CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  checkout:
    name: Stage 1 - Checkout Source Code
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Verify runner and repository information
      - name: Verify Runner
        run: |
          echo "========== Runner Details =========="
          echo "Runner Name      : $RUNNER_NAME"
          echo "Runner OS        : $RUNNER_OS"
          echo "Runner Arch      : $RUNNER_ARCH"
          echo "Hostname         : $(hostname)"

          echo ""
          echo "========== GitHub Details =========="
          echo "Repository       : ${{ github.repository }}"
          echo "Branch           : ${{ github.ref_name }}"
          echo "Commit SHA       : ${{ github.sha }}"
          echo "Workspace        : $GITHUB_WORKSPACE"

      # Verify repository contents
      - name: Verify Source Code
        run: |
          echo "========== Repository Contents =========="
          pwd
          ls -lah

          echo ""
          echo "========== Git Status =========="
          git status

          echo ""
          echo "========== Latest Commit =========="
          git log -1 --oneline

  setup:
    name: Stage 2 - Setup Build Environment
    needs: checkout
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Check out the repository because each job runs in an isolated environment.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Fail fast if the required Node.js manifest files are missing.
      - name: Verify Required Manifest Files
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking for required project files..."
          test -f package.json || { echo "ERROR: package.json not found."; exit 1; }
          test -f package-lock.json || { echo "ERROR: package-lock.json not found."; exit 1; }

          echo "Required files are present:"
          ls -l package.json package-lock.json

      # Set up Node.js and enable npm cache for later pipeline stages.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Verify the required toolchain and environment on the self-hosted runner.
      - name: Verify Build Environment
        shell: bash
        run: |
          set -euo pipefail

          echo "========== Runtime Versions =========="
          echo "Node.js Version   : $(node --version)"
          echo "npm Version       : $(npm --version)"
          echo "Java Version      :"
          java -version
          echo ""
          echo "AWS CLI Version   : $(aws --version)"
          echo ""
          echo "========== Environment =========="
          echo "PATH=$PATH"

  build:
    name: Stage 3 - Install Dependencies and Build
    needs: setup
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Each job runs in an isolated runner workspace, so checkout is required.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Restore the Node.js toolchain for this job and reuse npm cache.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Use deterministic dependency installation for CI.
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      # Build script is optional in some repos; fail with a clear message if missing.
      - name: Verify Build Script Exists
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(!p.scripts || !p.scripts.build){console.error('ERROR: Missing scripts.build in package.json'); process.exit(1)}"

      # Compile or package the application.
      - name: Build Application
        shell: bash
        run: |
          set -euo pipefail
          npm run build

  unit-test:
    name: Stage 4 - Unit Tests
    needs: build
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Checkout source for test execution in this isolated job.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Recreate Node.js environment and cache metadata.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Install exact dependency tree before tests.
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      # Run unit test suite defined in package.json.
      - name: Run Unit Tests
        shell: bash
        run: |
          set -euo pipefail
          npm test

  gitleaks:
    name: Stage 5 - Secret Scan (Gitleaks)
    needs: unit-test
    runs-on: [self-hosted, Linux, X64, web]
    permissions:
      contents: read

    steps:
      # Full history checkout improves secret detection across commits.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run Gitleaks and fail the job if secrets are detected.
      - name: Run Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonarqube:
    name: Stage 6 - SonarQube Analysis
    needs: gitleaks
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Checkout full repository history so SonarQube can compute SCM metadata accurately.
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure the required Node.js runtime and enable npm cache for faster installs.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Install dependencies exactly as locked to keep CI builds reproducible.
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      # Generate coverage artifacts, including coverage/lcov.info required by SonarQube.
      - name: Run Unit Tests with Coverage
        shell: bash
        run: |
          set -euo pipefail
          npm run test:coverage

      # Install Sonar Scanner CLI for this job so the scan does not depend on runner preinstallation.
      - name: Install Sonar Scanner CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save sonar-scanner

      # Verify the scanner CLI is available before uploading analysis.
      - name: Verify Sonar Scanner Availability
        shell: bash
        run: |
          set -euo pipefail
          npx sonar-scanner --version

      # Upload analysis to SonarQube using host URL from Variables and token from Secrets.
      - name: Run SonarQube Scan
        shell: bash
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail

          PROJECT_KEY="${GITHUB_REPOSITORY//\//_}"

          npx sonar-scanner \
            -Dsonar.projectKey="$PROJECT_KEY" \
            -Dsonar.projectName="$GITHUB_REPOSITORY" \
            -Dsonar.projectVersion="$GITHUB_SHA" \
            -Dsonar.sources=src \
            -Dsonar.tests=tests \
            -Dsonar.test.inclusions=tests/**/*.test.js \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.sourceEncoding=UTF-8 \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"

      # Persist scanner metadata so the next job can evaluate the Quality Gate.
      - name: Upload Sonar Scan Metadata
        uses: actions/upload-artifact@v4
        with:
          name: sonar-scan-metadata
          path: .scannerwork/report-task.txt
          if-no-files-found: error

  sonarqube-quality-gate:
    name: Stage 7 - SonarQube Quality Gate
    needs: sonarqube
    runs-on: [self-hosted, Linux, X64, web]
    permissions:
      contents: read

    steps:
      # Download scan metadata generated in the previous SonarQube analysis job.
      - name: Download Sonar Scan Metadata
        uses: actions/download-artifact@v4
        with:
          name: sonar-scan-metadata
          path: .scannerwork

      # Wait for SonarQube background processing and evaluate the official Quality Gate result.
      - name: Evaluate SonarQube Quality Gate
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 10
        with:
          pollingTimeoutSec: 600
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Always print the final gate status for visibility in workflow logs.
      - name: Display Quality Gate Status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "SonarQube Quality Gate Status: ${{ steps.quality-gate.outputs.quality-gate-status }}"

      # Fail immediately with an explicit error when the Quality Gate is not passed.
      - name: Fail on Quality Gate Failure
        if: steps.quality-gate.outputs.quality-gate-status != 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          echo "::error::SonarQube Quality Gate FAILED. Failing pipeline."
          exit 1

      # Confirm successful gate evaluation when status is PASSED.
      - name: Confirm Quality Gate Passed
        if: steps.quality-gate.outputs.quality-gate-status == 'PASSED'
        shell: bash
        run: |
          set -euo pipefail
          echo "SonarQube Quality Gate PASSED."

  npm-audit:
    name: Stage 8 - Dependency Vulnerability Scan (npm audit)
    needs: sonarqube-quality-gate
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      # Checkout repository because each job runs in an isolated workspace.
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Node.js runtime and npm cache for reproducible audit execution.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      # Install locked dependencies before scanning.
      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci

      # Fail pipeline on high/critical production dependency vulnerabilities.
      - name: Run npm audit (prod deps, high+)
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

  package:
    name: Stage 9 - Package Production Artifact
    needs: npm-audit
    runs-on: [self-hosted, Linux, X64, web]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Production Dependencies Only
        shell: bash
        run: |
          set -euo pipefail
          npm ci --omit=dev

      - name: Create Production Zip Artifact
        shell: bash
        run: |
          set -euo pipefail
          zip -r employee-api.zip src node_modules package.json index.js

      - name: Upload Lambda Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-api-package
          path: employee-api.zip
          retention-days: 7

  deploy:
    name: Stage 10 - Deploy to AWS Lambda
    needs: package
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux, X64, web]

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Lambda Zip Artifact
        uses: actions/download-artifact@v4
        with:
          name: employee-api-package
          path: .

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::755395261332:role/github-actions-role
          aws-region: ap-south-1
          role-session-name: GitHubActionsLambdaDeploy

      - name: Update AWS Lambda Function Code & Promote Live Alias
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying production package to AWS Lambda..."
          NEW_VERSION=$(aws lambda update-function-code \
            --function-name employee-api-dev \
            --zip-file fileb://employee-api.zip \
            --publish \
            --query 'Version' \
            --output text)
          echo "Published Version: $NEW_VERSION"
          echo "Promoting 'live' alias to Version $NEW_VERSION..."
          aws lambda update-alias \
            --function-name employee-api-dev \
            --name live \
            --function-version "$NEW_VERSION"
          echo "Lambda deployment and live alias promotion successful!"

      - name: Archive Application Package Artifact to S3
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET_NAME="employee-api-central-audit-dev-${ACCOUNT_ID}"
          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "Archiving application zip to s3://${BUCKET_NAME}/build-artifacts/employee-api-${{ github.sha }}.zip..."
            aws s3 cp employee-api.zip "s3://${BUCKET_NAME}/build-artifacts/employee-api-${{ github.sha }}.zip"
          fi

      - name: Deploy Frontend to S3 Static Website
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          FRONTEND_BUCKET="employee-api-frontend-dev-${ACCOUNT_ID}"
          AUDIT_BUCKET="employee-api-central-audit-dev-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$FRONTEND_BUCKET" 2>/dev/null; then
            echo "Syncing public/ Web UI to Frontend S3 bucket s3://${FRONTEND_BUCKET}..."
            aws s3 sync public/ "s3://${FRONTEND_BUCKET}/" --delete
            echo "Frontend successfully deployed to S3 Static Website bucket!"
          elif aws s3api head-bucket --bucket "$AUDIT_BUCKET" 2>/dev/null; then
            echo "Frontend bucket s3://${FRONTEND_BUCKET} not found. Syncing to central audit subfolder s3://${AUDIT_BUCKET}/frontend/..."
            aws s3 sync public/ "s3://${AUDIT_BUCKET}/frontend/" --delete
          else
            echo "WARNING: Neither frontend nor audit S3 bucket was accessible."
          fi

      - name: Archive CI Security Audit Metadata to S3
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          AUDIT_BUCKET="employee-api-central-audit-dev-${ACCOUNT_ID}"

          if aws s3api head-bucket --bucket "$AUDIT_BUCKET" 2>/dev/null; then
            echo "Uploading CI Security Audit report to s3://${AUDIT_BUCKET}/ci-security-scans/..."
            cat <<EOF > ci-security-audit.json
          {
            "repository": "${{ github.repository }}",
            "commit_sha": "${{ github.sha }}",
            "ref": "${{ github.ref }}",
            "actor": "${{ github.actor }}",
            "timestamp": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')",
            "scans_completed": ["gitleaks", "sonarqube-quality-gate", "npm-audit"],
            "status": "PASSED"
          }
          EOF
            aws s3 cp ci-security-audit.json "s3://${AUDIT_BUCKET}/ci-security-scans/scan-report-${{ github.sha }}.json"
            echo "CI Security Audit metadata archived successfully!"
          fi



